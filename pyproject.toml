[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-fts5-runner"
version = "0.1.0"
description = "Ground Claude Code prompts with a local SQLite FTS5 knowledge index (stdlib only)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["claude", "claude-code", "sqlite", "fts5", "bm25", "retrieval", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Text Processing :: Indexing",
]
# Runtime is standard library only (sqlite3 must be compiled with FTS5).
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/hadayalab-web/claude-fts5-runner"
Issues = "https://github.com/hadayalab-web/claude-fts5-runner/issues"

[project.scripts]
claude-fts5 = "claude_fts5_runner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
